# Held-out set: 10 questions written after the first round of error analysis
# and before the second run. They test the same business definitions on new
# questions, to check whether the prompt changes generalise or only fix the
# 30 questions they were made from.

- id: h01
  lang: en
  difficulty: easy
  question: How many sellers are based in the state of RJ?
  gold_sql: SELECT COUNT(*) FROM sellers WHERE seller_state = 'RJ'

- id: h02
  lang: en
  difficulty: medium
  question: How many unique customers are there in the state of SP?
  trap: People are counted with customer_unique_id (40,302, not 41,746).
  gold_sql: SELECT COUNT(DISTINCT customer_unique_id) FROM customers WHERE customer_state = 'SP'

- id: h03
  lang: en
  difficulty: medium
  question: What was the total revenue from delivered orders purchased in 2017?
  gold_sql: |
    SELECT SUM(i.price)
    FROM order_items AS i
    JOIN orders AS o ON o.order_id = i.order_id
    WHERE o.order_status = 'delivered' AND strftime('%Y', o.order_purchase_timestamp) = '2017'

- id: h04
  lang: en
  difficulty: medium
  question: What was the average freight per order for delivered orders purchased in 2018?
  trap: Freight is per item, so it has to be summed per order first.
  gold_sql: |
    SELECT AVG(order_freight)
    FROM (
        SELECT i.order_id, SUM(i.freight_value) AS order_freight
        FROM order_items AS i
        JOIN orders AS o ON o.order_id = i.order_id
        WHERE o.order_status = 'delivered' AND strftime('%Y', o.order_purchase_timestamp) = '2018'
        GROUP BY i.order_id
    )

- id: h05
  lang: en
  difficulty: medium
  question: What percentage of delivered orders purchased in 2018 arrived late?
  gold_sql: |
    SELECT 100.0 * SUM(order_delivered_customer_date > order_estimated_delivery_date) / COUNT(*)
    FROM orders
    WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
      AND strftime('%Y', order_purchase_timestamp) = '2018'

- id: h06
  lang: en
  difficulty: medium
  question: Which payment type has the highest average payment value?
  gold_sql: |
    SELECT payment_type FROM payments GROUP BY payment_type ORDER BY AVG(payment_value) DESC LIMIT 1

- id: h07
  lang: en
  difficulty: hard
  question: What is the median price of an order item?
  trap: SQLite has no MEDIAN() function.
  gold_sql: |
    WITH ordered AS (
        SELECT price, ROW_NUMBER() OVER (ORDER BY price) AS rn, COUNT(*) OVER () AS n FROM order_items
    )
    SELECT AVG(price) FROM ordered WHERE rn IN ((n + 1) / 2, (n + 2) / 2)

- id: h08
  lang: en
  difficulty: hard
  question: On delivered orders, what percentage of order items were shipped to a customer in a different state from the seller?
  gold_sql: |
    SELECT 100.0 * SUM(s.seller_state <> c.customer_state) / COUNT(*)
    FROM order_items AS i
    JOIN orders AS o ON o.order_id = i.order_id
    JOIN customers AS c ON c.customer_id = o.customer_id
    JOIN sellers AS s ON s.seller_id = i.seller_id
    WHERE o.order_status = 'delivered'

- id: h09
  lang: ja
  difficulty: medium
  question: 2017年に購入された配達済み注文の、購入から配達までの平均日数は何日ですか？
  gold_sql: |
    SELECT AVG(julianday(order_delivered_customer_date) - julianday(order_purchase_timestamp))
    FROM orders
    WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
      AND strftime('%Y', order_purchase_timestamp) = '2017'

- id: h10
  lang: ja
  difficulty: hard
  question: 顧客1人あたりの平均注文数はいくつですか？
  trap: People are counted with customer_unique_id; customer_id gives exactly 1.0.
  gold_sql: SELECT 1.0 * COUNT(*) / (SELECT COUNT(DISTINCT customer_unique_id) FROM customers) FROM orders
